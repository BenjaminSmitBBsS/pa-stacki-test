<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mijn BasisPagina</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #4f46e5;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .btn {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.7rem 1.15rem;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border: 0;
      cursor: pointer;
    }

    svg {
      display: block;
      width: 24px;
      height: 24px;
    }
  </style>
</head>
<body>
  <header class="container">
    <a href="#" style="display:inline-flex;align-items:center;gap:0.5rem;text-decoration:none;color:inherit;font-weight:700;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="2"></rect>
        <path d="M7 10h4M7 14h2"></path>
      </svg>
      <span>Merknaam</span>
    </a>
  </header>

  <main class="container">
    <section class="card">
      <h1>Korte, duidelijke hoofdkop</h1>
      <p style="color: var(--muted);">
        Een lichte, snelle basis zonder zware afhankelijkheden. Werkt direct in elke browser en op statische hosts.
      </p>
      <button id="actie-knop" class="btn" type="button">Test interactie</button>
      <p id="melding" style="margin-top:0.75rem;font-size:0.9rem;color:var(--muted);" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const knop = document.getElementById('actie-knop');
    const melding = document.getElementById('melding');
    knop?.addEventListener('click', () => {
      if (melding) melding.textContent = 'Interactie werkt direct in de browser.';
    });
  </script>
</body>
</html>
